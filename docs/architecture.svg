<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="460" fill="#0d1117"/>
  <text x="40" y="52" fill="#e6edf3" font-size="26" font-weight="700">EvidenceGate</text>
  <text x="40" y="78" fill="#8b949e" font-size="15">No finding ships without hashed, in-scope, real request/response proof.</text>

  <!-- Ledger box -->
  <rect x="40" y="110" width="360" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="140" fill="#39d353" font-size="15" font-weight="700">SQLite ledger</text>

  <rect x="60" y="156" width="150" height="86" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="72" y="180" fill="#e6edf3" font-size="13" font-weight="600">findings</text>
  <text x="72" y="202" fill="#8b949e" font-size="11.5">id · title · severity</text>
  <text x="72" y="220" fill="#8b949e" font-size="11.5">cvss_vector</text>
  <text x="72" y="235" fill="#f0883e" font-size="11.5">status: draft</text>

  <rect x="230" y="156" width="150" height="86" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" fill="#e6edf3" font-size="13" font-weight="600">evidence</text>
  <text x="242" y="202" fill="#8b949e" font-size="11.5">path · kind</text>
  <text x="242" y="220" fill="#39d353" font-size="11.5">sha256 (hashed)</text>
  <text x="242" y="235" fill="#8b949e" font-size="11.5">→ finding_id</text>

  <!-- trigger -->
  <rect x="60" y="262" width="320" height="60" rx="8" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
  <text x="76" y="286" fill="#f85149" font-size="13" font-weight="700">DB TRIGGER · enforced by the database</text>
  <text x="76" y="307" fill="#c9d1d9" font-size="12">confirm a finding → REFUSED unless it has evidence</text>

  <text x="60" y="352" fill="#8b949e" font-size="11.5">draft ──add-evidence──▶ confirm ✓</text>
  <text x="60" y="372" fill="#8b949e" font-size="11.5">draft ──confirm (no evidence)──▶</text>
  <text x="292" y="372" fill="#f85149" font-size="11.5" font-weight="600">RAISE ABORT</text>
  <text x="60" y="394" fill="#6e7681" font-size="11">One rule, un-bypassable — any writer hits it.</text>

  <!-- arrow -->
  <path d="M400 260 L470 260" stroke="#39d353" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#39d353"/></marker></defs>

  <!-- Gate box -->
  <rect x="490" y="110" width="390" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="512" y="140" fill="#39d353" font-size="15" font-weight="700">Deterministic gate</text>
  <text x="512" y="160" fill="#6e7681" font-size="11.5">builder and reviewer run it → same verdict</text>

  <g font-size="12.5" fill="#c9d1d9">
    <rect x="512" y="176" width="346" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="524" y="193"><tspan fill="#58a6ff" font-weight="700">G1</tspan>  evidence integrity — re-hash every file</text>
    <rect x="512" y="208" width="346" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="524" y="225"><tspan fill="#58a6ff" font-weight="700">G2</tspan>  CVSS 3.1 recomputed — severity must match</text>
    <rect x="512" y="240" width="346" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="524" y="257"><tspan fill="#58a6ff" font-weight="700">G3</tspan>  real proof — request + response present</text>
    <rect x="512" y="272" width="346" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="524" y="289"><tspan fill="#58a6ff" font-weight="700">G4</tspan>  scope — evidence host is in-scope</text>
    <rect x="512" y="304" width="346" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="524" y="321"><tspan fill="#58a6ff" font-weight="700">G5</tspan>  secrets — flag tokens/keys before sharing</text>
  </g>

  <rect x="512" y="344" width="168" height="46" rx="8" fill="#0d1117" stroke="#39d353" stroke-width="1.5"/>
  <text x="596" y="372" fill="#39d353" font-size="17" font-weight="700" text-anchor="middle">READY</text>
  <rect x="690" y="344" width="168" height="46" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="774" y="372" fill="#f85149" font-size="16" font-weight="700" text-anchor="middle">NOT READY</text>
</svg>
